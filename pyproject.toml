[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cam2body-calib"
version = "0.1.0"
description = "Monocular camera-to-body extrinsics calibration using visual fiducial markers"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cam2body-calib contributors" }]
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
cam2body-calib = "cam2body_calib.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cam2body_calib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
