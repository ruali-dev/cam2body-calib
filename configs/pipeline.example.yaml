# Pipeline Configuration Example
#
# This file shows the planned configuration structure for future versions.
# Currently only the single-image estimate command is implemented.

detector:
  type: aruco              # Options: aruco, charuco, apriltag (future)
  dictionary: DICT_4X4_50  # ArUco dictionary name

layout:
  type: custom             # Options: custom, charuco_board (future)

solver:
  ransac: true
  ransac_reprojection_error: 3.0   # pixels
  refine: true                     # LM refinement after RANSAC
