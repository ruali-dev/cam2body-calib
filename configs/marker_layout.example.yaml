# Marker Layout Configuration
# ============================
#
# Each marker is defined by its four corner positions in the body frame.
# Units: meters.
#
# CRITICAL - Corner ordering:
#   OpenCV ArUco returns corners CLOCKWISE from marker top-left.
#   YAML must list corners in the same order:
#     corner[0] = top-left, [1] = top-right, [2] = bottom-right, [3] = bottom-left

# ── Body frame convention ──────────────────────────────────────────
# Declare the coordinate convention used in this layout.
#   handedness: "right" (ROS REP-103, x=fwd y=left z=up) or
#               "left"  (vehicle_lh, x=fwd y=right z=up)
#   If omitted, defaults to right-handed.
#
# When handedness="left", the tool internally converts:
#   P_body_rh = diag([1, -1, 1]) @ P_vehicle_lh
# All PnP math runs in body_rh (right-handed).
# Output includes BOTH body_rh and vehicle_lh results.

body_frame:
  name: vehicle
  convention: x_forward_y_right_z_up
  handedness: left

# ── ArUco dictionary ───────────────────────────────────────────────
# DICT_4X4_50, DICT_4X4_100, DICT_4X4_250, DICT_4X4_1000,
# DICT_5X5_50, DICT_5X5_100, DICT_5X5_250, DICT_5X5_1000,
# DICT_6X6_50, DICT_6X6_100, DICT_6X6_250, DICT_6X6_1000,
# DICT_ARUCO_ORIGINAL

dictionary: DICT_4X4_50

# ── Export profiles (optional) ─────────────────────────────────────
# Convert canonical right-handed result to custom coordinate conventions.
# Currently supported: vehicle_lh_pose6
#
# The exporter uses S @ R @ S (NOT S @ R) to keep det = +1,
# so standard RPY extraction via scipy works correctly.
#   S = diag([1, -1, 1])  — mirrors y-axis (left <-> right)

export_profiles:
  - name: vehicle_lh_pose6
    type: pose6
    mirror_axes: [1, -1, 1]
    euler_order: xyz
    degrees: true
    yaw_positive: right
    pitch_positive: up

# ── Markers ────────────────────────────────────────────────────────
# Coordinates are in the body_frame declared above.
# If handedness=left: x=fwd, y=right, z=up

markers:
  # Example: marker ID 0 placed on wall in front of the vehicle
  0:
    corners_body:
      - [1.0,  0.25, 0.2]   # top-left
      - [1.0, -0.25, 0.2]   # top-right
      - [1.0, -0.25, 0.1]   # bottom-right
      - [1.0,  0.25, 0.1]   # bottom-left

  # Example: marker ID 1
  1:
    corners_body:
      - [1.2,  0.25, 0.2]   # top-left
      - [1.2, -0.25, 0.2]   # top-right
      - [1.2, -0.25, 0.1]   # bottom-right
      - [1.2,  0.25, 0.1]   # bottom-left
